plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

def versionedBuildTasks = ['build', 'jar', 'reobfJar', 'pipelineTest', 'pipelineServer', 'pipelineAll']
def shouldIncrementModVersion = gradle.startParameter.taskNames.any { requested ->
    versionedBuildTasks.any { requested == it || requested.endsWith(":${it}") }
}

def incrementPatchVersionIfNeeded = {
    if (!shouldIncrementModVersion) return mod_version

    def propertiesFile = file('gradle.properties')
    def propertiesText = propertiesFile.getText('UTF-8')
    def matcher = propertiesText =~ /(?m)^mod_version=(\d+)\.(\d+)\.(\d+)(.*)$/
    if (!matcher.find()) {
        throw new GradleException("mod_version doit etre au format X.Y.Z dans gradle.properties pour l'increment automatique.")
    }

    def major = matcher.group(1)
    def minor = matcher.group(2)
    def patch = matcher.group(3).toInteger() + 1
    def suffix = matcher.group(4)
    def nextVersion = "${major}.${minor}.${patch}${suffix}"
    propertiesFile.setText(propertiesText.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${nextVersion}"), 'UTF-8')
    println "[MedievalStructures] Version de build auto-incrementee: ${mod_version} -> ${nextVersion}"
    return nextVersion
}

ext.mod_version = incrementPatchVersionIfNeeded()

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    // Cette ligne est importante pour que le mod puisse accéder aux classes de MedievalCoins
    // si vous utilisez un projet multi-modules, mais ici on va utiliser un fichier JAR local.

    runs {
        gameTestServer {
            workingDirectory project.file('run-exploration-tests')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// Configuration pour inclure le JAR de MedievalCoins
repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Dépendance vers MedievalCoins (le fichier doit être dans le dossier 'libs')
    // 'implementation' permet d'utiliser le code, 'fg.deobf' gère le mapping
    implementation fg.deobf("fr.renblood.medievalcoins:medieval_coins:${medieval_coins_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    destinationDirectory = layout.buildDirectory.dir('libs')
    //    destinationDirectory = file('C:\\Users\\yolol\\AppData\\Roaming\\ModrinthApp\\profiles\\Test Renblood\\mods')
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def testProfileMods = file('C:/Users/alban/AppData/Roaming/ModrinthApp/profiles/Test Mods RP/mods')
def serverProfileMods = file('C:/Users/alban/AppData/Roaming/ModrinthApp/profiles/MAJ-RP-2024-1.20.1/mods')
def localServerMods = file('D:/Projets/Projet/localhost/_server1.20.1/mods')
def archiveMods = file('D:/Projets/Projet/mods')

def installLatestJar = { File destination ->
    delete fileTree(destination) { include "${mod_id}-*.jar" }
    copy {
        from tasks.named('jar').flatMap { it.archiveFile }
        into destination
    }
}

tasks.register('pipelineTest') {
    dependsOn 'reobfJar'
    doLast {
        installLatestJar(testProfileMods)
        copy { from tasks.named('jar').flatMap { it.archiveFile }; into archiveMods }
    }
}

tasks.register('pipelineServer') {
    dependsOn 'reobfJar'
    doLast {
        installLatestJar(serverProfileMods)
        installLatestJar(localServerMods)
        copy { from tasks.named('jar').flatMap { it.archiveFile }; into archiveMods }
    }
}

tasks.register('pipelineAll') {
    dependsOn 'pipelineTest', 'pipelineServer'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
